name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Run all tests
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          bun test --reporter=junit --reporter-outfile=test-results/junit.xml 2>&1 | tee test-results/tests.log
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.os }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
  package:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package tested source
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=own-harness/ --output=dist/own-harness.tar.gz HEAD AGENTS.md DESIGN.md README.md LICENSE package.json docs packages
          cd dist
          sha256sum own-harness.tar.gz > SHA256SUMS
      - name: Save distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: own-harness-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
